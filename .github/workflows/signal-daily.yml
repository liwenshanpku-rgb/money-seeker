# 每天日线收盘后发布公开信号 signal/latest.json（提交到 ai-journal 分支），供本地下单程序读取。
# 同时更新 AI 顾问的行情快照 ai_journal/snapshot.json（每周一由 Claude Code 定时任务读取并决策）
# 和模拟盘评估 ai_journal/review.txt / review.png。
# 只用公开行情数据和 AI 决策日志，不需要任何密钥，也不含任何持仓。
# 字段说明：reports/signal.md；读取示例：examples/read_signal.py
name: Daily public signal

on:
  schedule:
    - cron: "45 0 * * *"   # 每天 00:45 UTC（北京时间 08:45）
    - cron: "17 2 * * 1"   # 周一再跑一次（北京时间 10:17），带上 Claude Code 定时任务刚记录的 AI 决定
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-journal
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Load journal branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin ai-journal
          git worktree add -B ai-journal journal origin/ai-journal

      - name: AI snapshot
        continue-on-error: true   # 快照失败不影响发布信号；定时任务会发现快照过期并报告
        run: python -m money_seeker ai-snapshot --out journal/ai_journal/snapshot.json

      - name: Paper-trading review
        continue-on-error: true
        run: |
          J=journal/ai_journal/decisions.jsonl
          if [ -s "$J" ]; then
            python -m money_seeker ai-review --journal "$J" --plot journal/ai_journal/review.png \
              | tee journal/ai_journal/review.txt
          fi

      - name: Build signal
        run: |
          J=journal/ai_journal/decisions.jsonl
          AI="--no-ai"
          if [ -s "$J" ]; then AI="--ai-journal $J"; fi
          python -m money_seeker signal $AI --out journal/signal/latest.json \
            --history journal/signal/history.jsonl
          { echo '```json'; cat journal/signal/latest.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit signal
        run: |
          cd journal
          git add signal ai_journal
          git commit -m "Signal $(date -u +%F)"
          for i in 1 2 3; do
            git push origin ai-journal && exit 0
            sleep $((i * 5)); git pull --rebase origin ai-journal
          done
          exit 1
