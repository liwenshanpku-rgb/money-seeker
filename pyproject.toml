[project]
name = "money-seeker"
version = "0.1.0"
description = "Crypto daily-bar data fetcher and grid strategy backtester"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "requests>=2.28", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
money-seeker = "money_seeker.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["money_seeker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
